name: "CI Early-Warn Beacon (opt-in)"
description: "Sends an anonymized runner-image health beacon at job end. No code, logs or secrets are sent."
inputs:
  endpoint: {description: "Collector URL, e.g. https://collector.example/v1/beacon", required: true}
  token: {description: "v0.2 tenant token (secret EW_TOKEN). Server assigns tenant id; salt kept for v0.1 compatibility.", required: false, default: ""}
  tenant-salt: {description: "Secret salt (store in a repo/org secret). Used to hash repo/org locally.", required: true}
  job-status: {description: "Pass ${{ job.status }}", required: true}
  failed-step: {description: "Optional name of the failing step; only a category is sent", required: false, default: ""}
  send-toolchain: {description: "Send node/python/java/go major.minor versions", required: false, default: "true"}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        EW_ENDPOINT: ${{ inputs.endpoint }}
        EW_SALT: ${{ inputs.tenant-salt }}
        EW_TOKEN: ${{ inputs.token }}
        EW_STATUS: ${{ inputs.job-status }}
        EW_STEP: ${{ inputs.failed-step }}
        EW_TOOLCHAIN: ${{ inputs.send-toolchain }}
      run: python3 "${{ github.action_path }}/beacon.py" || echo "early-warn beacon skipped (non-fatal)"
